services:
  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      FAP_HOST: 0.0.0.0
    ports:
      - "5000:5000"
    volumes:
      - dados-fap:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fap
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fap}
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fap"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-dados:
  dados-fap:
